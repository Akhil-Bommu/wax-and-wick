name: Wax and Wick CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run automated tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t wax-and-wick .

      - name: Run container and check website
        run: |
          docker run -d -p 8080:80 --name candles wax-and-wick
          sleep 3
          curl -f http://localhost:8080
